name: Metadata regression checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/metadata/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - '.github/workflows/metadata-check.yml'
  push:
    branches:
      - 'feature/tmdb-ru-ratings-20261027'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify metadata boundaries and inline scripts
        run: node --test tests/metadata.test.mjs
